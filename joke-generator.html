<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 0.95rem;
        }

        .joke-display {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 8px;
            margin-bottom: 30px;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .joke-setup {
            font-size: 1.1rem;
            margin-bottom: 15px;
            font-weight: 500;
            line-height: 1.6;
        }

        .joke-punchline {
            font-size: 1.3rem;
            font-weight: bold;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid rgba(255, 255, 255, 0.3);
            opacity: 0;
            transition: opacity 0.5s ease-in;
        }

        .joke-punchline.show {
            opacity: 1;
        }

        .loading {
            text-align: center;
            color: #667eea;
            font-weight: bold;
            margin: 20px 0;
            display: none;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .secondary-btn {
            background: #f0f0f0;
            color: #333;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .secondary-btn:hover {
            background: #e0e0e0;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .category-select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            margin-bottom: 20px;
            cursor: pointer;
            background: white;
            color: #333;
            transition: border-color 0.3s;
        }

        .category-select:hover {
            border-color: #667eea;
        }

        .category-select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }

        .joke-type {
            text-align: center;
            color: #999;
            font-size: 0.85rem;
            margin-top: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2rem;
            }

            .joke-display {
                min-height: 120px;
                padding: 20px;
            }

            .joke-setup {
                font-size: 1rem;
            }

            .joke-punchline {
                font-size: 1.1rem;
            }

            button {
                padding: 10px 20px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>😂 Joke Generator</h1>
        <p class="subtitle">Get a random laugh!</p>

        <select id="categorySelect" class="category-select">
            <option value="any">Any Category</option>
            <option value="general">General</option>
            <option value="programming">Programming</option>
            <option value="knock-knock">Knock-Knock</option>
        </select>

        <div class="error" id="error"></div>

        <div class="joke-display" id="jokeDisplay">
            <p>Click "Get Joke" to start laughing! 🎉</p>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Loading your joke...</p>
        </div>

        <div class="joke-type" id="jokeType"></div>

        <div class="button-group">
            <button onclick="getJoke()">Get Joke</button>
            <button class="secondary-btn" onclick="revealPunchline()">Reveal Punchline</button>
            <button class="secondary-btn" onclick="shareJoke()">Share</button>
        </div>
    </div>

    <script>
        let currentJoke = null;
        let punchlineRevealed = false;

        async function getJoke() {
            const category = document.getElementById('categorySelect').value;
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const button = event.target;

            loading.style.display = 'block';
            error.style.display = 'none';
            button.disabled = true;
            punchlineRevealed = false;

            try {
                let url = 'https://official-joke-api.appspot.com/jokes';

                if (category !== 'any') {
                    url += `/${category}/random`;
                } else {
                    url += '/random';
                }

                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error('Failed to fetch joke');
                }

                let data = await response.json();

                // Handle array response (for random jokes)
                if (Array.isArray(data)) {
                    data = data[0];
                }

                currentJoke = data;
                displayJoke();
                document.getElementById('jokeType').textContent = `Type: ${data.type}`;

            } catch (err) {
                error.style.display = 'block';
                error.textContent = 'Oops! Could not load a joke. Please try again!';
                console.error('Error:', err);
            } finally {
                loading.style.display = 'none';
                button.disabled = false;
            }
        }

        function displayJoke() {
            const jokeDisplay = document.getElementById('jokeDisplay');
            const punchline = document.querySelector('.joke-punchline');

            if (currentJoke.type === 'general' || currentJoke.type === 'programming') {
                jokeDisplay.innerHTML = `
                    <div class="joke-setup">${currentJoke.setup}</div>
                    <div class="joke-punchline">${currentJoke.punchline}</div>
                `;
            } else if (currentJoke.type === 'knock-knock') {
                jokeDisplay.innerHTML = `
                    <div class="joke-setup">
                        <strong>Knock, knock!</strong><br>
                        Who's there? ${currentJoke.setup}
                    </div>
                    <div class="joke-punchline">${currentJoke.punchline}</div>
                `;
            }
        }

        function revealPunchline() {
            if (!currentJoke) {
                alert('Get a joke first!');
                return;
            }

            const punchline = document.querySelector('.joke-punchline');
            punchline.classList.add('show');
            punchlineRevealed = true;
        }

        function shareJoke() {
            if (!currentJoke) {
                alert('Get a joke first!');
                return;
            }

            const jokeText = `${currentJoke.setup}\n\n${currentJoke.punchline}`;
            const shareText = `Check out this joke:\n\n${jokeText}\n\n😂 From Joke Generator`;

            if (navigator.share) {
                navigator.share({
                    title: 'Random Joke',
                    text: shareText
                }).catch(err => console.log('Error sharing:', err));
            } else {
                // Fallback: copy to clipboard
                navigator.clipboard.writeText(shareText).then(() => {
                    alert('Joke copied to clipboard!');
                }).catch(() => {
                    alert('Share not supported. Here\'s the joke:\n\n' + jokeText);
                });
            }
        }

        // Load a joke on page load
        window.addEventListener('load', () => {
            getJoke();
        });

        // Category change
        document.getElementById('categorySelect').addEventListener('change', () => {
            punchlineRevealed = false;
        });
    </script>
</body>
</html>
